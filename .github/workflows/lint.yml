name: Code Quality

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'tests/**'
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: 'latest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: lint-uv-${{ runner.os }}-3.12-${{ hashFiles('uv.lock') }}
          restore-keys: |
            lint-uv-${{ runner.os }}-3.12-

      - name: Install dependencies with lint tools
        run: |
          uv sync --extra dev --all-groups
          uv pip install mypy ruff black bandit

      - name: Run ruff linting
        id: ruff
        continue-on-error: true  # 初期允许 linting 错误，逐步修复
        run: |
          uv run ruff check jiuwenclaw/ --output-format=github

      - name: Run black format check
        id: black
        run: |
          uv run black --check --diff jiuwenclaw/

      - name: Run mypy type checking
        id: mypy
        run: |
          uv run mypy jiuwenclaw/ \
            --ignore-missing-imports \
            --no-error-summary \
            || true  # 初期允许类型检查失败，逐步改进
        continue-on-error: true

      - name: Run bandit security scan
        id: bandit
        run: |
          uv run bandit -r jiuwenclaw/ \
            -ll \
            --skip B101,B311 \
            --format custom
        continue-on-error: true  # 初期允许安全问题，逐步修复

      - name: Summary of all checks
        if: always()
        run: |
          echo "## Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tool | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| ruff | ${{ steps.ruff.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| black | ${{ steps.black.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| mypy | ${{ steps.mypy.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| bandit | ${{ steps.bandit.outcome }} |" >> $GITHUB_STEP_SUMMARY
